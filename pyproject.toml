[project]
name = "knowledgeos"
version = "0.1.0"
description = "KnowledgeOS Owner, roles and surfaces for the KnowledgeHub Vault"
requires-python = ">=3.12,<3.13"
dependencies = [
  "operationkit",
  "PyYAML>=6.0,<7",
  "pathspec==0.12.1",
  "temporalio==1.34.0",
  "temporalio-langgraph==0.1.0",
  "langgraph==1.2.0",
  "numpy==2.3.4",
]

[tool.uv.sources]
operationkit = { path = "../../OperationKit", editable = true }

[project.scripts]
knowledgeos = "knowledgeos.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8,<9",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledgeos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"
