schema_version: 1
contract_id: knowledgeos-blueprint-v2
status: implementation_blueprint
contract_validation:
  schema: blueprint/blueprint.schema.json
  checksum_manifest: blueprint/CHECKSUMS.sha256
  command: vaultctl blueprint validate
  blueprint_authoring_source_of_truth: blueprint/blueprint.yaml
  generated_runtime_artifacts:
    properties: ops/policies/properties.yaml
    pipeline_registry: ops/actions
    trusted_schemas: ops/schemas
  post_bootstrap_operational_source_of_truth: ops/policies_and_schemas_with_blueprint_roundtrip_check
  cross_document_checks:
    - path_type_template_consistency
    - action_command_schema_consistency
    - bridge_state_and_runtime_path_consistency
    - markdown_examples_validate_against_generated_schemas
    - checked_in_generated_artifacts_have_zero_diff
    - canonical_registry_sets_and_relation_directions_are_exact
    - base_dashboard_filter_sort_limit_consistency
    - projection_required_fields_nullability_hash_domain_and_ordering
    - capture_finalize_and_project_bundle_transaction_contracts
    - negative_mutation_fixtures_fail_closed
path_namespaces:
  obsidian_working_copy_bridge: vault_relative_posix
  control_jobs_and_policies: control_root_relative_posix_with_vault_prefix
  runtime_artifacts: runtime_relative_posix
  bridge_ingest_records_both: true
path_match_semantics: gitwildmatch_with_nfc_and_casefold_collision_checks
authoritative_document: OBSIDIAN_VAULT_BLUEPRINT.md
technical_annex: OBSIDIAN_VAULT_WHITEPAPER.md
conflict_precedence:
  - OBSIDIAN_VAULT_BLUEPRINT.md
  - blueprint/blueprint.yaml
  - OBSIDIAN_VAULT_WHITEPAPER.md

defaults:
  workspace_name: KnowledgeOS
  vault_name: KnowledgeHub
  language: ko
  canonical_timezone: Asia/Seoul
  notes_remote_visibility: private
  mobile_git_client: working_copy
  mac_git_client: obsidian_git_manual
  remote_unattended: false
  mobile_immediate_api: false
  always_on_git_roundtrip: false
  query_engine: core_bases_plus_tasks
  retrieval_phase: lexical_first

repositories:
  control:
    root: .
    responsibility:
      - docs
      - ops
      - automation_tests
    excludes:
      - KnowledgeHub
      - runtime
  vault:
    root: KnowledgeHub
    independent_git_repository: true
    remote_role: github_notes_repository
    obsidian_vault_root: true
    mobile_clone_root: true
    mobile_invariant: linked_external_worktree_root_equals_obsidian_vault_root
    mobile_git_metadata_may_remain_in_working_copy_container: true
    tracked_transport_root: .vault-bridge
  runtime:
    root: runtime
    git_tracked: false
    contains_durable_evidence: true
  receipt_git_fields:
    job:
      - control_git_head
      - vault_git_head
    commit:
      - control_git_head
      - vault_git_head_before
      - vault_git_head_after
      - vault_relative_paths
      - staged_blob_hashes
  job_output_commit_repository: vault
  control_repository_commit_is_separate: true

device_profiles:
  mac:
    role: decide_connect_execute
    config_folder: .obsidian-mac
    start_note: Home.md
    git_writer: obsidian_git_manual
    llm_execution: true
    canonical_apply: interactive_only
  iphone:
    role: capture_consult_defer
    config_folder: .obsidian-phone
    start_note: Mobile.md
    git_writer: working_copy
    llm_execution: request_or_optional_api
    canonical_apply: false
    target_consult_seconds: 10
    target_capture_seconds: 30
  ipad:
    role: read_annotate_light_clarify
    config_folder: .obsidian-tablet
    start_note: Mobile.md
    git_writer: working_copy
    llm_execution: request_or_review
    canonical_apply: false
  mobile_safe_work:
    - unique_capture_create
    - open_daily
    - search_and_read
    - short_body_edit
    - set_triage_hint
    - publish_bridge_request
    - inspect_proposal
  mobile_forbidden_work:
    - bulk_move
    - bulk_rename
    - delete
    - plugin_install
    - git_conflict_resolution
    - canonical_llm_apply

mobile_install_gate:
  requires_working_copy_pro:
    - push
    - linked_external_repository
  external_worktree_location: on_my_device/Obsidian/KnowledgeHub
  forbidden_parallel_sync: [icloud_drive, obsidian_sync, dropbox, onedrive]
  expected_root_sentinel: .knowledgeos-root.json
  root_sentinel_contract:
    required_fields: [schema_version, contract_id, vault_uuid, canonical_vault_name, remote_identity_sha256, expected_branch]
    schema_version: 1
    contract_id: knowledgeos-vault-root-v1
    canonical_vault_name: KnowledgeHub
    remote_identity_canonical_form: "github.com/<lowercase-owner>/<lowercase-repository>.git\\n"
    remote_identity_sha256: sha256_of_utf8_canonical_form
    forbid_in_remote_identity: [credentials, token, query, fragment]
  verify:
    - expected_remote_fingerprint
    - expected_branch
    - worktree_root_equals_vault_root
    - config_override_and_restart
    - roundtrip_fixture
  pull_merge_requires_obsidian_closed: true

