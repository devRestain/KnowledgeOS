shortcut_contracts:
  - id: ko_capture
    display_name: KO · Capture
    input: [share_sheet, dictation, text]
    output: unique_capture_note
    overwrites_existing: false
    pull_before_capture: false
    durable_outbox_first: true
    automatic_commit_requires_exact_staged_set_visibility: true
  - id: ko_save_source
    display_name: KO · Save Source
    input: [url, selected_text, comment]
    output: unique_capture_note
    overwrites_existing: false
  - id: ko_today
    display_name: KO · Today
    input: []
    output: open_daily_or_mobile
    writes_files: false
  - id: ko_defer_to_mac
    display_name: KO · Defer to Mac
    input: [source_path, action_id]
    output: immutable_bridge_request
    overwrites_existing: false
    hash_domain: sha256_of_committed_git_blob_bytes
    requires_source: [tracked, byte_identical_to_expected_head_blob, no_index_or_worktree_drift]
    capability_gate: working_copy_exact_committed_blob_access_verified
    unavailable_or_dirty_fallback: show_status_and_do_not_publish_request
  - id: ko_sync
    display_name: KO · Sync
    input: []
    output: safe_sync_or_status_ui
    requires_obsidian_closed: true
    automatic_merge_only_if_fast_forward_proven: true
    after_fast_forward: validate_and_quicklook_latest_bridge_response_for_this_device

mobile_recovery_outbox:
  root: on_my_device/KnowledgeHub-Recovery/Outbox
  outside_notes_repository: true
  payload_path: JOB_ID/input.json
  event_path: JOB_ID/events/NNNN-event.json
  create_only: true
  payload_hash: sha256
  states: [captured, vault_written, committed, pushed, remote_observed, local_vault_transferred]
  retry_idempotency: job_id_plus_payload_sha256
  identity_binding: job_id_equals_note_id_and_deterministic_target_path_is_in_payload
  remote_observed: expected_remote_branch_contains_exact_target_blob_sha256
  cleanup_requires: [remote_observed_or_local_vault_transfer_receipt, minimum_age_7_days, interactive_confirmation]
  pre_persist_cancel_guarantee: none
  post_persist_failure_guarantee: payload_and_event_survive_cancel_reboot_retry
  stale_warning_days: 30
  encrypted_device_backup_required: true

mobile_git_transaction:
  capture_runs_pull: false
  verify_before_write: [repository, remote_fingerprint, branch, root_sentinel]
  include_all_modified: false
  auto_commit_requires:
    - preexisting_staged_set_empty
    - staged_set_equals_exact_new_paths
    - installed_action_exposes_staged_set
  fallback: open_single_file_commit_ui_and_keep_outbox
  push_failure: keep_local_commit_and_outbox
  every_commit_and_push_requires:
    - expected_repository_remote_branch_and_sentinel
    - exact_changed_and_staged_path_set_visible
    - all_changed_bytes_pass_github_storage_policy
    - no_confidential_frontmatter
    - bounded_secret_pattern_scan
    - explicit_user_confirmation
  if_bytes_or_staged_set_cannot_be_inspected: no_automatic_commit_or_push
  existing_file_edit:
    allowed_mutation: [short_body_edit, triage_hint, triage_projects, needs_desktop_review]
    requires_clean_fast_forward_sync_before_edit: true
    commit_mode: interactive_exact_file_only
    privacy_gate_is_same_as_new_capture: true
  sync:
    requires_obsidian_closed: true
    clean_only: true
    fast_forward_only: true
    diverged_or_unknown: open_status_ui_without_merge

actions:
  pipeline_registry:
    directory: ops/actions
    one_config_per_pipeline_kind: true
    filenames:
      triage: triage.json
      draft_note: draft-note.json
      summarize: summarize.json
      link_suggestions: link-suggestions.json
      normalize: normalize.json
      answer: answer.json
  user_action_routes:
    organize: {pipelines: [triage, normalize]}
    summarize: {pipelines: [summarize]}
    relate: {pipelines: [link_suggestions], requires_candidate_set: true}
    extract: {pipelines: [draft_note]}
    inbox: {pipelines: [triage], fan_out_per_source: true, default_limit: 20}
    project-summary: {pipelines: [summarize], preprocess: retrieve_with_project_scope, requires_candidate_set: true}
  invariants:
    - every_bridge_pipeline_kind_maps_to_exactly_one_registry_file
    - every_pipeline_registry_entry_resolves_to_one_action_config_and_one_prompt_file
    - user_action_route_is_not_an_output_schema_identity
    - unknown_or_duplicate_pipeline_mapping_fails_closed

automation_lanes:
  l0_capture:
    model: none
    vault_output_scope: [00_Inbox]
    runtime_output_scope: []
    approval: invocation
  l1_mac_interactive:
    route_id: codex_chatgpt_login
    execution_class: remote
    vault_output_scope: [01_AI_Review]
    runtime_output_scope: [review, runs, receipts]
    approval: preview_then_human
  l1_mobile_async:
    transport: .vault-bridge
    execution_device: mac
    vault_output_scope: [01_AI_Review, .vault-bridge/responses]
    runtime_output_scope: [awaiting_remote_authorization, queue, review, runs, receipts]
    approval: preview_then_human
  l1_mobile_immediate:
    enabled_by_default: false
    provider: openai_api_via_relay
    max_payload_bytes: 20480
    vault_output_scope: [00_Inbox, 01_AI_Review]
    runtime_output_scope: []
    approval: mobile_preview_before_save
    enablement_requires:
      - https_endpoint
      - audience_bound_short_ttl_action_scoped_revocable_token
      - request_uuid_plus_payload_hash_idempotency
      - action_request_and_response_schemas
      - payload_timeout_retry_limits
      - per_user_rate_and_daily_monthly_cost_budgets
      - kill_switch
      - verified_no_raw_payload_prompt_answer_or_auth_logs
      - relay_has_no_vault_or_github_credentials
      - device_outbox_and_preview_before_create
      - replay_expiry_offline_partial_schema_failure_tests
  l2_retrieval:
    capability: hybrid
    enabled_components: [lexical_fts, typed_link_expansion]
    vector_enabled_by_default: false
    vector_enablement_gate: optional_vector_rrf_improves_baseline
    vault_output_scope: [01_AI_Review]
    runtime_output_scope: [index, review, runs, receipts]
    approval: promote_through_proposal

bridge:
  root: .vault-bridge
  trusted_schemas:
    request: ops/schemas/bridge-request.schema.json
    response: ops/schemas/bridge-response.schema.json
  deployed_schema_copies:
    request: .vault-bridge/protocol/request.schema.json
    response: .vault-bridge/protocol/response.schema.json
    authority: generated_copy_with_digest_not_import_authority
  request_path_pattern: .vault-bridge/requests/YYYY/MM/JOB_ID.json
  response_path_pattern: .vault-bridge/responses/YYYY/MM/JOB_ID/NNNN-status.json
  immutable: true
  request_contains_content: false
  request_required_fields:
    - schema_version
    - job_id
    - created_at
    - device_id
    - pipeline_kind
    - source.path
    - source.blob_sha256
    - target
    - parameters
    - route_id
    - mode
  action_contracts:
    triage:
      target: null
      optional_source_fields: [locator, fragment_sha256]
      output_schema: ops/schemas/triage-result.schema.json
    draft_note:
      target_required: [path, expected_sha256, type]
      expected_sha256: ""
      parameters_one_of: [selected_candidate_id_and_digest, validated_title]
      output_schema: ops/schemas/proposal.schema.json
    summarize:
      target: null
      parameter: bounded_summary_mode
      output_schema: ops/schemas/answer.schema.json#summary
    link_suggestions:
      target_must_equal_source_path_and_hash: true
      parameter: retrieval_profile_id
      candidate_set_generated_on_mac: true
      output_schema: ops/schemas/proposal.schema.json
    answer:
      target: null
      query_must_be_source_capture_reference: true
      parameters: [scope_id]
      output_schema: ops/schemas/answer.schema.json#answer
  ingest_checks:
    - trusted_control_schema
    - uuid_v4
    - path_namespace
    - request_committed_in_expected_branch
    - request_add_only_history
    - request_blob_sha256
    - source_blob_same_commit_tree
    - source_blob_sha256
    - current_worktree_drift
    - regular_file
    - size_limit
    - replay
    - privacy
  ingest_receipt_fields:
    - request_path
    - request_sha256
    - request_blob_id
    - introducing_commit
    - committed_tree_id
    - source_path
    - source_blob_id
    - source_blob_sha256
    - normalized_internal_manifest_sha256
    - bridge_schema_sha256
  idempotency:
    key: job_id_plus_canonical_request_sha256
    same_id_same_digest: no_op
    same_id_different_digest: quarantine_tamper_conflict
  states:
    - committed_request
    - ingested
    - awaiting_remote_authorization
    - queued
    - rejected
    - running
    - proposal_ready
    - answer_ready
    - no_change
    - insufficient_input
    - refused
    - failed
    - conflict
    - expired
    - published_local
    - human_push
    - mobile_visible
  allowed_transitions:
    committed_request: [ingested]
    ingested: [awaiting_remote_authorization, queued, rejected, conflict]
    awaiting_remote_authorization: [queued, rejected, expired]
    queued: [running, rejected, conflict]
    running: [proposal_ready, answer_ready, no_change, insufficient_input, refused, failed, conflict]
    proposal_ready: [published_local, rejected, expired, conflict]
    answer_ready: [published_local, expired, conflict]
    no_change: [published_local]
    insufficient_input: [published_local]
    refused: [published_local]
    failed: [published_local]
    conflict: [published_local]
    rejected: [published_local]
    expired: [published_local]
    published_local: [human_push]
    human_push: [mobile_visible]
  response:
    writer: vaultctl_bridge_publish_only
    status_enum: [awaiting_remote_authorization, queued, rejected, needs_review, answer_ready, no_change, insufficient_input, refused, failed, conflict, expired]
    required_fields: [schema_version, job_id, sequence, status, event_at, request_sha256, request_commit, warnings]
    terminal_statuses: [rejected, needs_review, answer_ready, no_change, insufficient_input, refused, failed, conflict, expired]
    terminal_required_fields: [completed_at, job_receipt_sha256, output_schema_sha256]
    proposal_fields: [proposal_id, proposal_path, proposal_sha256]
    answer_fields: [answer_id, answer_plaintext, citations, answer_sha256]
    answer_plaintext_forbids: [html, active_markdown_embed, command_uri]
    write_mode: create_only
    mobile_visibility: ko_sync_validates_latest_event_and_displays_status_or_bounded_result_in_quicklook
  state_mapping:
    awaiting_remote_authorization: {runtime: awaiting_remote_authorization, public_status: awaiting_remote_authorization}
    queued: {runtime: queue, public_status: queued}
    rejected: {runtime: rejected, public_status: rejected}
    proposal_ready: {runtime: review, public_status: needs_review, review_folder: 01_AI_Review/Pending}
    answer_ready: {runtime: review, public_status: answer_ready}
    no_change: {runtime: done, public_status: no_change}
    insufficient_input: {runtime: done, public_status: insufficient_input}
    refused: {runtime: done, public_status: refused}
    failed: {runtime: failed, public_status: failed}
    conflict: {runtime: conflict, public_status: conflict, review_folder: 01_AI_Review/Conflict}
    expired: {runtime: expired, public_status: expired, review_folder: 01_AI_Review/Expired}
  publish:
    interactive_only: true
    exact_commit_repository: vault
    exact_commit_set: [response_event, proposal_artifact_if_status_needs_review]
    pushes_remote: false
    crash_recovery:
      - fsync_publish_intent_before_response_create
      - on_retry_recompute_identical_canonical_event_digest
      - resume_only_if_existing_event_and_staged_or_committed_blob_match_intent
      - quarantine_on_any_digest_or_path_mismatch
      - append_completion_record_after_commit
  detection:
    baseline: manual_sync_then_vaultctl_bridge_ingest
    scheduled_reconcile_scans_local_committed_head: true
    performs_git_network_io: false
  retention:
    v1_delete_or_move: false
    future_compaction_requires: [permanent_digest_tombstone, explicit_adr]
  trust_boundary:
    baseline: notes_repository_write_access
    device_id_is_authentication: false
    stronger_option: device_signature_adr
  implicit_git_network_commands: false

llm:
  default_interactive_route: codex_chatgpt_login
  routes:
    codex_chatgpt_login: {execution_class: remote}
    openai_api_relay: {execution_class: remote, enabled_by_default: false}
    local_profile: {route_id_pattern: "local:<profile>", execution_class: local}
  silent_provider_fallback: false
  live_vault_write: false
  provider_envelopes:
    schema_version: 1
    contract_id: knowledgeos-provider-envelopes-v1
    runtime_root: runtime
    context_path_pattern: runtime/runs/JOB_ID/context.json
    request_path_pattern: runtime/runs/JOB_ID/request.json
    schemas:
      request: ops/schemas/provider-request.schema.json
      response: ops/schemas/provider-response.schema.json
      receipt: ops/schemas/provider-receipt.schema.json
      failure: ops/schemas/provider-failure.schema.json
      authorization: ops/schemas/remote-authorization.schema.json
      context: ops/schemas/frozen-context.schema.json
    limits:
      max_request_bytes: 65536
      max_context_bytes: 1048576
      max_prompt_bytes: 131072
      max_response_bytes: 262144
      max_failure_message_bytes: 1000
      max_candidates: 50
      max_source_hashes: 50
      max_warnings: 20
      max_json_depth: 8
      max_output_tokens: 1024
      max_timeout_seconds: 120
      max_job_age_seconds: 3600
    privacy:
      raw_prompt: private_runtime_only
      raw_response: private_runtime_only
      receipt_content: hashes_only
      ordinary_logs: codes_and_hashes_only
    runner_boundary:
      vault_mount: false
      canonical_apply: false
      networkless_core: true
      model_output_untrusted: true
  output_outcomes:
    - proposed
    - decision
    - no_change
    - insufficient_input
    - refused
  triage:
    allowed_source_types: [capture, daily]
    allowed_candidate_types: [task, idea, question, knowledge, project, source]
    candidate_min: 1
    candidate_max: 5
    candidate_is_write_operation: false
    selected_candidate_creates_separate_job: true
    daily_source_requires_locator_and_fragment_hash: true
    capture_finalize:
      command: vaultctl capture finalize
      interactive_only: true
      model_operations: false
      transaction:
        - verify_source_hash_and_capture_schema
        - validate_outcome_triaged_or_discarded
        - resolve_optional_related_target
        - journal_status_and_related_update_intent
        - publish_frontmatter_update
        - link_aware_move_to_90_Archive/Captures/YYYY
        - verify_destination_schema_and_links
        - append_completion_receipt
      crash_recovery: resume_from_fsynced_journal_or_quarantine_on_hash_conflict
  draft_note:
    allowed_source_types: [capture, daily, source, idea]
    allowed_target_types: [idea, question, knowledge, project, source]
    one_target_per_job: true
    project_target_creates_deterministic_bundle_directories: true
  remote_authorization:
    state: awaiting_remote_authorization
    command: vaultctl ai authorize-remote JOB_ID --expires RFC3339
    tty_only: true
    artifact_path: runtime/runs/JOB_ID/receipts/remote-authorization.json
    mutates_immutable_job_manifest: false
    state_manifest_references_artifact_path_and_sha256: true
    binds:
      - canonical_request_sha256
      - committed_vault_tree_id
      - source_and_fragment_hashes
      - action_config_sha256
      - prompt_sha256
      - output_schema_sha256
      - provider_route_and_resolved_model
      - privacy_policy_sha256
      - expiry
  approval_binds:
    - proposal_sha256
    - diff_sha256
    - source_baselines
    - target_baselines
    - bridge_request_sha256_or_null
    - committed_vault_tree_id
    - action_config_sha256
    - prompt_sha256
    - policy_bundle_sha256
    - schema_sha256
    - provider_route_and_resolved_model
    - candidate_set_sha256_or_null
    - retrieval_config_sha256_or_null
    - input_index_generation_or_null
    - control_and_vault_git_baselines
    - triage_selection_set_sha256_or_null
    - expiry
  partial_relation_approval:
    mutates_original_proposal: false
    produces_filtered_proposal_and_new_diff: true
    requires_new_digest_bound_approval: true

projection:
  output_path_namespace: runtime_relative_posix
  schema_path_namespace: control_root_relative_posix
  generation_root: index/exports/generations/GENERATION_ID
  notes_jsonl: index/exports/generations/GENERATION_ID/notes.jsonl
  edges_jsonl: index/exports/generations/GENERATION_ID/edges.jsonl
  manifest: index/exports/generations/GENERATION_ID/manifest.json
  current_pointer: index/exports/current.json
  schemas:
    note_record: ops/schemas/note-record.schema.json
    edge_record: ops/schemas/edge-record.schema.json
    retrieval_candidate: ops/schemas/retrieval-candidate.schema.json
    answer: ops/schemas/answer.schema.json
  record_contracts:
    note:
      additional_properties: false
      required: [id, path, title, type, status, properties, body, wikilinks, created, modified, content_hash, schema_version]
      fields:
        id: uuid_or_system_id
        path: vault_relative_posix
        title: text
        type: note_type_enum
        status: type_status_enum
        properties: flat_object_excluding_promoted_fields
        body: text
        wikilinks: list_of_wikilink_records
        created: iso8601_with_offset
        modified: iso8601_with_offset
        content_hash: sha256
        schema_version: integer
      promoted_frontmatter_fields: [schema_version, id, type, title, status, created, modified]
      properties_contract:
        key_order: unicode_codepoint_lexicographic_after_nfc
        values: validated_flat_frontmatter_values
      wikilink_item:
        additional_properties: false
        required: [raw_target, resolved_id, resolved_path, locator]
        fields:
          raw_target: text
          resolved_id: uuid_or_system_id_or_null
          resolved_path: vault_relative_posix_or_null
          locator: text_or_null
        unresolved_link: preserve_raw_target_with_null_resolved_fields
      content_hash_domain: sha256_of_exact_utf8_lf_source_markdown_bytes
    edge:
      additional_properties: false
      required: [subject_id, edge_kind, predicate, object_id, subject_path, object_path, provenance, source_locator, object_locator, source_content_hash, relation_schema_version]
      fields:
        subject_id: uuid_or_system_id
        edge_kind: [semantic, context]
        predicate: registry_value
        object_id: uuid_or_system_id
        subject_path: vault_relative_posix
        object_path: vault_relative_posix
        provenance: canonical_property
        source_locator: frontmatter_predicate_index
        object_locator: text_or_null
        source_content_hash: sha256
        relation_schema_version: integer
      nullability:
        object_locator: text_or_null
      duplicate_policy: duplicate_canonical_edge_tuple_is_validation_error
  serialization:
    encoding: utf8
    bom: false
    newline: lf
    terminal_newline_count: 1
    json_separators: compact
    object_key_order: unicode_codepoint_lexicographic_after_nfc
    record_sort:
      notes: [path_nfc_utf8_bytes, id]
      edges: [subject_id, edge_kind, predicate, object_id, object_locator_nulls_first]
    source_list_order: preserve
    non_lf_or_invalid_utf8_source: reject
  deterministic_sort: true
  byte_stable_for_same_inputs: true
  publish_protocol:
    - freeze_source_path_hash_snapshot
    - write_and_fsync_generation_files
    - write_and_fsync_generation_manifest
    - verify_source_snapshot_unchanged
    - atomic_replace_current_pointer
    - fsync_parent_directory
  reader_contract: read_pointer_once_and_use_one_generation_only
  reject_mixed_generation_or_digest_mismatch: true
  modifies_vault: false
  canonical_edges_only: true
  canonical_edge_fields:
    - subject_id
    - edge_kind
    - predicate
    - object_id
    - subject_path
    - object_path
    - provenance
    - source_locator
    - object_locator
    - source_content_hash
    - relation_schema_version
  excluded_from_byte_stable_projection:
    - file_mtime
    - local_receipt_provenance
    - proposal_confidence

retrieval:
  phases:
    - native_exact_and_links
    - lexical_fts
    - local_vectors
    - reciprocal_rank_fusion
    - bounded_typed_graph_expansion
  graph_expansion:
    default_hops: 1
    maximum_hops: 2
    per_hop_node_cap: 20
    total_edge_cap: 60
    total_candidate_cap: 50
    one_hop_allowlist:
      predicates: [supports, contradicts, explains, applies_to, derived_from, implements, raises, projects, areas, topics, sources, people, related]
      directions: [outgoing, incoming]
    two_hop_sequence_allowlist:
      - [{direction: incoming, predicate: applies_to}, {direction: incoming, predicate: supports}]
      - [{direction: incoming, predicate: applies_to}, {direction: incoming, predicate: contradicts}]
      - [{direction: outgoing, predicate: implements}, {direction: outgoing, predicate: derived_from}]
      - [{direction: outgoing, predicate: raises}, {direction: incoming, predicate: explains}]
      - [{direction: incoming, predicate: projects}, {direction: outgoing, predicate: sources}]
    unknown_sequence_policy: reject
  corpus:
    default_include_types: [knowledge, source, project, project_note, artifact, idea, question]
    journal_requires_explicit_scope: true
    exclude_paths:
      - .vault-bridge/**
      - .obsidian-*/**
      - 99_System/**
      - 01_AI_Review/Rejected/**
      - 01_AI_Review/Expired/**
    review_corpus_separate: [01_AI_Review/Pending/**, 01_AI_Review/Conflict/**]
  policy_gate_points:
    - before_remote_embedding_or_indexing
    - during_candidate_fusion_and_graph_expansion
    - immediately_before_model_context
  remote_embedding:
    allowed_ai_policy: [remote_ok]
    ask_requires_digest_bound_interactive_authorization: true
    local_only_and_deny_forbidden: true
  local_embedding:
    deny_forbidden: true
  filter_before_model:
    - scope
    - path
    - type
    - sensitivity
    - ai_policy
  frozen_candidate_fields:
    - query_sha256
    - policy_decision_sha256
    - index_generation_id
    - note_id
    - path
    - content_hash
    - chunk_id
    - chunk_hash
    - chunk_locator
    - retrieval_reason
    - lexical_score_and_rank
    - vector_score_and_rank
    - rrf_parameter_and_rank
    - graph_path
    - parser_and_chunker_version
    - embedding_provider_model_dimension_and_artifact_digest
    - indexer_version
    - retrieval_config_sha256
  staleness:
    default: fail_closed_and_require_rebuild
    running_query_pins_generation: true
  answer_requires:
    - note_id
    - path
    - locator
    - evidence_hash
    - uncertainty
  graphrag_default: deferred

privacy:
  sensitivity_values: [public, personal, confidential]
  ai_policy_values: [remote_ok, ask, local_only, deny]
  defaults:
    general: {sensitivity: personal, ai_policy: ask}
    person: {sensitivity: personal, ai_policy: deny}
    meeting: {sensitivity: personal, ai_policy: deny}
  forbidden_combinations:
    - {sensitivity: confidential, ai_policy: remote_ok}
  multi_source_rule: every_source_must_pass_and_output_inherits_strictest
