    target_pattern: 20_Projects/selected-project/Artifacts/title.md
    requires_existing_active_project: true
  NEW_AREA:
    template: T30_Area.md
    target_pattern: 30_Areas/title.md
  NEW_KNOWLEDGE:
    template: T40_Knowledge.md
