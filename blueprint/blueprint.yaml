  attendees: {obsidian_type: list, item_type: quoted_wikilink_or_text}
  purpose: {obsidian_type: text, min_length: 1}
  audience: {obsidian_type: text, enum: [desktop, mobile, system]}
  today_focus: {obsidian_type: text}
  triage_hint: {obsidian_type: text, enum: [none, discard, hold, task, project, idea, question, knowledge, source]}

note_types:
  capture:
    path_globs:
      - 00_Inbox/Captures/**/*.md
      - 90_Archive/Captures/**/*.md
    statuses: [unprocessed, triaged, discarded]
    required_extra: [captured_from, capture_device, capture_kind, triage_hint, needs_desktop_review]
    optional_extra: [capture_label, device_timezone, canonical_date, canonical_timezone, triage_projects, asset, asset_hash, extractor, extractor_version, page_locator_scheme]
    template: T00_Capture.md
  proposal:
    path_globs:
      - 01_AI_Review/**/*.md
    statuses: [pending, approved, applied, rejected, conflict, expired]
    required_extra: [proposal_id, source_hashes]
    template: T01_AI_Proposal.md
  daily:
    path_globs:
      - 10_Journal/Daily/**/*.md
    statuses: [open, closed]
    required_extra: [period_start, period_end]
    optional_extra: [today_focus]
    template: T10_Daily.md
  weekly:
    path_globs:
      - 10_Journal/Weekly/**/*.md
    statuses: [open, closed]
    required_extra: [period_start, period_end]
    template: T11_Weekly.md
  monthly:
    path_globs:
      - 10_Journal/Monthly/**/*.md
    statuses: [open, closed]
    required_extra: [period_start, period_end]
    template: T12_Monthly.md
  project:
    path_globs:
      - 20_Projects/*/*.md
      - 90_Archive/Projects/*/*/*.md
    root_filename_equals_parent: true
    statuses: [planned, active, blocked, done, cancelled]
    required_extra: [outcome, priority]
    optional_extra: [focus_rank, next_action, target_date]
    conditional_requirements:
      - when: {status: active}
        require: [focus_rank, next_action]
      - when: {status: blocked}
        require: [focus_rank, next_action]
    field_constraints:
      focus_rank: {type: integer, minimum: 1}
      priority: {enum: [high, medium, low]}
    template: T20_Project.md
  project_note:
    path_globs:
      - 20_Projects/*/Working/**/*.md
      - 90_Archive/Projects/*/*/Working/**/*.md
    exclude_globs:
      - 20_Projects/*/Working/*MOC.md
      - 90_Archive/Projects/*/*/Working/*MOC.md
    statuses: [draft, active, superseded, archived]
    required_extra: [projects, note_kind]
    field_constraints:
      projects: {min_items: 1, max_items: 1, must_resolve_to_parent_project_bundle: true}
    template: T24_Project_Note.md
  idea:
    path_globs:
      - 40_Knowledge/Ideas/**/*.md
    statuses: [seed, incubating, testing, promoted, parked, dropped]
    required_extra: [possibility]
    template: T21_Idea.md
  question:
    path_globs:
      - 40_Knowledge/Questions/**/*.md
    statuses: [open, deciding, answered, deferred, closed]
    required_extra: [question_kind]
    optional_extra: [decision, decision_by, priority]
    conditional_requirements:
      - when: {question_kind: decision}
        require: [decision]
    template: T22_Question.md
  artifact:
    path_globs:
      - 20_Projects/*/Artifacts/**/*.md
      - 90_Archive/Projects/*/*/Artifacts/**/*.md
    statuses: [draft, review, final, deprecated]
    required_extra: [artifact_kind, projects]
    optional_extra: [artifact_uri, artifact_hash, artifact_repo, asset]
    field_constraints:
      projects: {min_items: 1, max_items: 1, must_resolve_to_parent_project_bundle: true}
      when_status_final_require_one_of: [artifact_uri, artifact_repo, asset]
      artifact_hash_must_bind_to: [artifact_uri, artifact_repo, asset]
    template: T23_Artifact.md
  area:
    path_globs:
      - 30_Areas/**/*.md
    statuses: [active, paused, retired]
    required_extra: [standard, review_cadence, next_review]
    template: T30_Area.md
  knowledge:
    path_globs:
      - 40_Knowledge/Notes/**/*.md
    statuses: [seed, developing, evergreen, deprecated]
    required_extra: [claim, confidence]
    optional_extra: [last_reviewed]
    template: T40_Knowledge.md
  source:
    path_globs:
      - 40_Knowledge/Sources/**/*.md
    statuses: [queued, reading, processed, archived]
    required_extra: [source_kind]
    optional_extra: [source_url, authors, published_date, citation_key, asset, asset_hash, extractor, extractor_version, page_locator_scheme, derived_from]
    field_constraints:
      when_status_processed_or_archived_require_one_of: [source_url, asset, derived_from, citation_key]
    template: T41_Source.md
  person:
    path_globs:
      - 40_Knowledge/People/**/*.md
    statuses: [active, inactive]
    required_extra: []
    optional_extra: [organization]
    default_ai_policy: deny
    template: T42_Person.md
  moc:
    path_globs:
      - 50_Maps/**/*.md
      - 20_Projects/*/Working/*MOC.md
      - 90_Archive/Projects/*/*/Working/*MOC.md
    statuses: [active, retired]
    required_extra: [scope]
    template: T50_MOC.md
  meeting:
    path_globs:
      - 60_Meetings/**/*.md
    statuses: [scheduled, held, cancelled]
    required_extra: [meeting_at, attendees]
    default_ai_policy: deny
    template: T60_Meeting.md
  home:
    exact_paths: [Home.md, Mobile.md]
    statuses: [active]
    required_extra: [purpose, audience]
  system:
    path_globs:
      - 99_System/**/*.md
    exclude_globs:
      - 99_System/Templates/**/*.md
    statuses: [active, deprecated]
    required_extra: [purpose]

mobile_capture:
  path_pattern: 00_Inbox/Captures/YYYY/MM/YYYYMMDD-HHmmss-device-uuid8.md
  write_mode: create_only
  user_label_property: capture_label
  user_label_is_not_in_path: true
  body_preservation: verbatim_under_original_heading
  common_daily_append: forbidden_by_default
  triage_hint_values:
    - none
    - discard
    - hold
    - task
    - project
    - idea
    - question
    - knowledge
    - source
  triage_hint_invariants:
    - status_remains_unprocessed
    - path_does_not_change
    - final_triage_runs_on_mac
  time_fields:
    - created_with_device_offset
    - device_timezone
    - canonical_date
    - canonical_timezone
  default_needs_desktop_review: true
  conditional_required:
    when_captured_from: [ios_shortcut, ipad_shortcut, ios_share_sheet, ipad_share_sheet]
    require: [capture_label, capture_device, device_timezone, canonical_date, canonical_timezone, needs_desktop_review]
  limits:
    markdown_bytes: 65536
    selected_text_bytes: 20480
    reject_nul_and_invalid_utf8: true
    long_dictation: local_outbox_then_mac_import

mobile_assets:
  allowed_mime: [image/jpeg, image/png, application/pdf]
  heic_behavior: convert_to_jpeg_and_revalidate_or_create_metadata_placeholder
  max_image_bytes: 5242880
  max_pdf_bytes: 10485760
  forbidden: [audio, video, executable]
  oversize_behavior: url_filename_size_sha256_placeholder
  assets_soft_warning_bytes: 262144000
  worktree_soft_warning_bytes: 1073741824
  lfs: deferred_until_working_copy_roundtrip_adr

relation_registry:
  canonical_predicates:
    supports:
      allowed_subject_types: [source, knowledge]
      allowed_object_types: [knowledge]
    contradicts:
      allowed_subject_types: [source, knowledge]
      allowed_object_types: [knowledge]
    explains:
      allowed_subject_types: [knowledge]
      allowed_object_types: [knowledge, question]
    applies_to:
      allowed_subject_types: [knowledge]
      allowed_object_types: [project, idea]
    derived_from:
      allowed_subject_types: [idea, question, knowledge, project, artifact, source]
      allowed_object_types: [capture, daily, weekly, monthly, source, idea, meeting]
    implements:
      allowed_subject_types: [project]
      allowed_object_types: [idea]
    raises:
      allowed_subject_types: [idea, knowledge, project]
      allowed_object_types: [question]
  inverse_aliases:
    supported_by: invert_to_supports
    raised_by: invert_to_raises
  unknown_predicate_policy: propose_related_or_reject
  context_predicates:
    projects: {allowed_object_types: [project]}
    areas: {allowed_object_types: [area]}
    topics: {allowed_object_types: [moc]}
    sources: {allowed_object_types: [source]}
    people: {allowed_object_types: [person]}
    related: {allowed_object_types: [any_note]}
  edge_kinds:
    semantic: canonical_predicates
    context: context_predicates
    wikilink: notes_jsonl_only
  inverse_materialization: false
  proposal_provenance: ai_proposed
  canonical_projection_provenance: canonical_property
  canonical_source_locator: frontmatter_predicate_index
  canonical_object_locator: wikilink_fragment_or_null
  proposal_confidence_is_not_canonical: true
  receipt_provenance_is_local_audit_overlay: true

templates:
  directory: 99_System/Templates
  required:
    - T00_Capture.md
    - T01_AI_Proposal.md
    - T10_Daily.md
    - T11_Weekly.md
    - T12_Monthly.md
    - T20_Project.md
    - T21_Idea.md
    - T22_Question.md
    - T23_Artifact.md
    - T24_Project_Note.md
    - T30_Area.md
    - T40_Knowledge.md
    - T41_Source.md
    - T42_Person.md
    - T50_MOC.md
    - T60_Meeting.md

bases:
  directory: 99_System/Bases
  required:
    - Inbox.base
    - Projects.base
    - Decisions.base
    - Knowledge.base
    - Sources.base
    - Review.base
    - Journal.base
  views:
    Journal.base:
      Today Focus:
        filters: {type: daily, period_start: today}
        sort: [file_name_desc]
        limit: 1
        columns: [file.link, today_focus]
    Projects.base:
      Now:
        filters:
          type: project
          status_in: [active, blocked]
        sort: [focus_rank_asc, priority_high_to_low, target_date_asc_nulls_last, file_name_asc]
        limit: 3
        columns: [file.link, status, next_action, focus_rank, priority, target_date]
      Mobile:
        filters:
          type: project
          status_in: [active, blocked]
        sort: [focus_rank_asc, priority_high_to_low, target_date_asc_nulls_last, file_name_asc]
        limit: 3
        columns: [file.link, next_action, status]
      Next Actions:
        filters:
          type: project
          status_in: [active, blocked]
          next_action_nonempty: true
        sort: [focus_rank_asc, priority_high_to_low, target_date_asc_nulls_last, file_name_asc]
        limit: 3
        columns: [file.link, next_action, status]
      Blocked:
        filters: {type: project, status: blocked}
        sort: [focus_rank_asc, priority_high_to_low, file_name_asc]
        limit: 5
        columns: [file.link, next_action, target_date]
    Decisions.base:
      Open:
        filters:
          type: question
          status_in: [open, deciding]
          question_kind: decision
          decision_nonempty: true
        sort: [decision_by_asc_nulls_last, priority_high_to_low, file_name_asc]
        limit: 5
        columns: [file.link, decision, decision_by, projects, priority]
    Knowledge.base:
      Ideas:
        filters:
          type: idea
          status_in: [seed, incubating, testing]
        sort: [file_mtime_desc, file_name_asc]
        limit: 10
        columns: [file.link, status, possibility, projects, file.mtime]
      Radar:
        filters:
          type_in: [knowledge, idea]
        sort: [file_mtime_desc, file_name_asc]
        limit: 6
        columns: [file.link, type, status, confidence, file.mtime]
    Inbox.base:
      Unprocessed:
        filters: {type: capture, status: unprocessed}
        sort: [created_asc, file_name_asc]
        limit: 10
        columns: [file.link, created, capture_kind, triage_hint, needs_desktop_review]
      Mobile Review:
        filters: {type: capture, status: unprocessed, needs_desktop_review: true}
        sort: [created_asc, file_name_asc]
        limit: 5
        columns: [file.link, capture_label, triage_hint]
    Sources.base:
      Reading queue:
        filters:
          type: source
          status_in: [queued, reading]
        sort: [published_date_desc_nulls_last, file_name_asc]
        limit: 10
        columns: [file.link, status, source_kind, authors, published_date]
      Processed:
        filters: {type: source, status: processed}
        sort: [file_mtime_desc, file_name_asc]
        limit: 20
        columns: [file.link, source_kind, published_date, source_url]
    Review.base:
      PendingOrConflict:
        filters: {type: proposal, status_in: [pending, conflict]}
        sort: [created_asc, file_name_asc]
        limit: 10
        columns: [file.link, status, proposal_id, created]
      Mobile Results:
        filters: {type: proposal, status_in: [pending, conflict]}
        sort: [created_desc, file_name_asc]
        limit: 5
        columns: [file.link, status, created]
  generated_against_installed_obsidian_version: true
  cli_query_smoke_required: true

dashboards:
  home:
    path: Home.md
    type: home
    audience: desktop
    sections:
      - name: today_direction
        source: Journal.base
        view: Today Focus
        limit: 1
        always_available_secondary_action: obsidian_daily_uri_canonical_vault_name
      - name: quick_capture
        actions: [CAPTURE_THOUGHT, NEW_IDEA, NEW_PROJECT, NEW_QUESTION, NEW_KNOWLEDGE]
        baseline_launcher: quickadd_verified_command_ids_with_hotkeys
        hotkeys: [option_command_i, option_command_j, option_command_p, option_command_q, option_command_k]
      - name: now
        source: Projects.base
        view: Now
        limit: 3
        status_in: [active, blocked]
        sort: [focus_rank_asc, priority_high_to_low, target_date_asc_nulls_last, file_name_asc]
      - name: needs_a_decision
        source: Decisions.base
        view: Open
        limit: 5
        sort: [decision_by_asc_nulls_last, priority_high_to_low, file_name_asc]
      - name: next_actions
        source: Projects.base
        view: Next Actions
        limit: 3
      - name: knowledge_radar
        source: Knowledge.base
        view: Radar
        limit: 6
        freshness_field: file.mtime
      - name: inbox
        source: Inbox.base
        view: Unprocessed
        limit: 10
      - name: ai_review
        source: Review.base
        view: PendingOrConflict
        limit: 10
      - name: support_status
        blocked_source: Projects.base#Blocked
        waiting_source: 99_System/Dashboards/Tasks.md#Waiting
        sync_source: obsidian_git_status_bar_or_vaultctl_git_status
        must_not_persist_stale_sync_claim: true
  mobile:
    path: Mobile.md
    type: home
    audience: mobile
    layout: single_column
    community_plugin_required: false
    stale_snapshot_notice_required: true
    sections:
      - name: quick_capture
        actions: [ko_capture, ko_save_source, ko_defer_to_mac, ko_sync]
        link_scheme: shortcuts_percent_encoded
      - name: today
        action: obsidian_daily_canonical_vault_name
      - name: focus_projects_and_next_actions
        source: Projects.base
        view: Mobile
        limit: 3
        canonical_action_field: next_action
      - name: needs_desktop_review
        source: Inbox.base
        view: Mobile Review
        limit: 5
      - name: ai_results
        source: Review.base
        view: Mobile Results
        limit: 5
      - name: bookmarks
        fallback: plain_wikilinks
        moc_fallback: obsidian_search_exact_vault_query_path_50_maps

plugin_profiles:
  core_all_devices:
