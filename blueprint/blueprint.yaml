common_properties:
  required:
    schema_version: {obsidian_type: number, const: 1}
    id:
      obsidian_type: text
      format: uuid_v4_or_approved_deterministic_id
      immutable: true
      approved_deterministic_id_classes: [proposal_from_job_uuid, periodic_from_period_id, system_fixed_id]
    type:
      obsidian_type: text
      enum: [capture, proposal, daily, weekly, monthly, project, project_note, idea, question, artifact, area, knowledge, source, person, moc, meeting, home, system]
    title: {obsidian_type: text, min_length: 1, equals_filename_stem: true}
    status: {obsidian_type: text, enum_from: note_types.TYPE.statuses}
    created: {obsidian_type: datetime, require_timezone: true}
    modified: {obsidian_type: datetime, require_timezone: true, semantics: schema_writer_time}
    aliases: {obsidian_type: list, item_type: text}
    tags: {obsidian_type: tags}
    sensitivity: {obsidian_type: text, enum: [public, personal, confidential]}
    ai_policy: {obsidian_type: text, enum: [remote_ok, ask, local_only, deny]}
    ai_status: {obsidian_type: text, enum: [idle, queued, proposed, approved, applied, rejected, conflict, expired, error]}
  optional_context_lists:
    - projects
    - areas
    - topics
    - sources
    - people
    - related
  optional_relation_lists:
    - supports
    - contradicts
    - explains
    - applies_to
    - derived_from
    - implements
    - raises
  invariants:
    - title_equals_file_basename
    - id_is_immutable
    - wikilinks_in_yaml_are_quoted
    - modified_is_schema_writer_time
    - freshness_uses_file_mtime

property_registry:
  projects: {obsidian_type: list, item_type: quoted_wikilink, object_type: project}
  areas: {obsidian_type: list, item_type: quoted_wikilink, object_type: area}
  topics: {obsidian_type: list, item_type: quoted_wikilink, object_type: moc}
  sources: {obsidian_type: list, item_type: quoted_wikilink, object_type: source}
  people: {obsidian_type: list, item_type: quoted_wikilink, object_type: person}
  related: {obsidian_type: list, item_type: quoted_wikilink, object_type: any_note}
  supports: {obsidian_type: list, item_type: quoted_wikilink, object_type: knowledge}
  contradicts: {obsidian_type: list, item_type: quoted_wikilink, object_type: knowledge}
  explains: {obsidian_type: list, item_type: quoted_wikilink, object_type: knowledge_or_question}
  applies_to: {obsidian_type: list, item_type: quoted_wikilink, object_type: project_or_idea}
  derived_from: {obsidian_type: list, item_type: quoted_wikilink, object_type: provenance_source}
  implements: {obsidian_type: list, item_type: quoted_wikilink, object_type: idea}
  raises: {obsidian_type: list, item_type: quoted_wikilink, object_type: question}
  priority: {obsidian_type: text, enum: [high, medium, low]}
  focus_rank: {obsidian_type: number, integer: true, minimum: 1}
  next_action: {obsidian_type: text, min_length: 1}
  outcome: {obsidian_type: text, min_length: 1}
  target_date: {obsidian_type: date}
  question_kind: {obsidian_type: text, enum: [decision, research, problem]}
  decision: {obsidian_type: text}
  decision_by: {obsidian_type: date}
  confidence: {obsidian_type: text, enum: [low, medium, high, unknown]}
  artifact_kind: {obsidian_type: text, enum: [specification, prototype, report, presentation, code, dataset, other]}
  artifact_uri: {obsidian_type: text}
  artifact_hash: {obsidian_type: text}
  artifact_repo: {obsidian_type: text}
  capture_kind: {obsidian_type: text, enum: [thought, url, quote, voice, file, other]}
  capture_label: {obsidian_type: text}
  captured_from: {obsidian_type: text, enum: [mac_quickadd, mac_cli, ios_shortcut, ipad_shortcut, ios_share_sheet, ipad_share_sheet, import]}
  capture_device: {obsidian_type: text, enum: [mac, iphone, ipad]}
  triage_projects: {obsidian_type: list, item_type: quoted_wikilink, object_type: project}
  needs_desktop_review: {obsidian_type: checkbox}
  device_timezone: {obsidian_type: text, format: iana_timezone}
  canonical_date: {obsidian_type: date}
  canonical_timezone: {obsidian_type: text, format: iana_timezone}
  cssclasses: {obsidian_type: list, item_type: text}
  possibility: {obsidian_type: text, min_length: 1}
  proposal_id: {obsidian_type: text, format: uuid_v4}
  source_hashes: {obsidian_type: list, item_type: text, item_format: "vault_relative_path_or_frozen_runtime_path|sha256:64hex"}
  period_start: {obsidian_type: date}
  period_end: {obsidian_type: date}
  standard: {obsidian_type: text, min_length: 1}
  review_cadence: {obsidian_type: text, enum: [weekly, monthly, quarterly, semiannual, annual]}
  next_review: {obsidian_type: date}
  claim: {obsidian_type: text, min_length: 1}
  last_reviewed: {obsidian_type: date}
  source_kind: {obsidian_type: text, enum: [paper, book, article, web, video, podcast, course, document, dataset, other]}
  source_url: {obsidian_type: text, format: uri}
  authors: {obsidian_type: list, item_type: text}
  published_date: {obsidian_type: date}
  citation_key: {obsidian_type: text}
  asset: {obsidian_type: text, format: quoted_wikilink_to_80_assets}
  asset_hash: {obsidian_type: text, format: sha256}
  extractor: {obsidian_type: text}
  extractor_version: {obsidian_type: text}
  page_locator_scheme: {obsidian_type: text}
  organization: {obsidian_type: text}
  note_kind: {obsidian_type: text, enum: [exploration, draft, research, plan, log, other]}
  scope: {obsidian_type: text, min_length: 1}
  meeting_at: {obsidian_type: datetime, require_timezone: true}
  attendees: {obsidian_type: list, item_type: quoted_wikilink_or_text}
  purpose: {obsidian_type: text, min_length: 1}
  audience: {obsidian_type: text, enum: [desktop, mobile, system]}
  today_focus: {obsidian_type: text}
  triage_hint: {obsidian_type: text, enum: [none, discard, hold, task, project, idea, question, knowledge, source]}

note_types:
  capture:
    path_globs:
      - 00_Inbox/Captures/**/*.md
      - 90_Archive/Captures/**/*.md
    statuses: [unprocessed, triaged, discarded]
    required_extra: [captured_from, capture_device, capture_kind, triage_hint, needs_desktop_review]
    optional_extra: [capture_label, device_timezone, canonical_date, canonical_timezone, triage_projects, asset, asset_hash, extractor, extractor_version, page_locator_scheme]
    template: T00_Capture.md
  proposal:
    path_globs:
      - 01_AI_Review/**/*.md
    statuses: [pending, approved, applied, rejected, conflict, expired]
    required_extra: [proposal_id, source_hashes]
    template: T01_AI_Proposal.md
  daily:
    path_globs:
      - 10_Journal/Daily/**/*.md
    statuses: [open, closed]
    required_extra: [period_start, period_end]
    optional_extra: [today_focus]
    template: T10_Daily.md
  weekly:
    path_globs:
      - 10_Journal/Weekly/**/*.md
    statuses: [open, closed]
    required_extra: [period_start, period_end]
    template: T11_Weekly.md
  monthly:
    path_globs:
      - 10_Journal/Monthly/**/*.md
    statuses: [open, closed]
    required_extra: [period_start, period_end]
    template: T12_Monthly.md
  project:
    path_globs:
      - 20_Projects/*/*.md
      - 90_Archive/Projects/*/*/*.md
    root_filename_equals_parent: true
    statuses: [planned, active, blocked, done, cancelled]
    required_extra: [outcome, priority]
    optional_extra: [focus_rank, next_action, target_date]
    conditional_requirements:
      - when: {status: active}
        require: [focus_rank, next_action]
      - when: {status: blocked}
        require: [focus_rank, next_action]
    field_constraints:
      focus_rank: {type: integer, minimum: 1}
      priority: {enum: [high, medium, low]}
    template: T20_Project.md
  project_note:
    path_globs:
      - 20_Projects/*/Working/**/*.md
      - 90_Archive/Projects/*/*/Working/**/*.md
    exclude_globs:
      - 20_Projects/*/Working/*MOC.md
      - 90_Archive/Projects/*/*/Working/*MOC.md
    statuses: [draft, active, superseded, archived]
    required_extra: [projects, note_kind]
    field_constraints:
      projects: {min_items: 1, max_items: 1, must_resolve_to_parent_project_bundle: true}
    template: T24_Project_Note.md
  idea:
    path_globs:
      - 40_Knowledge/Ideas/**/*.md
    statuses: [seed, incubating, testing, promoted, parked, dropped]
    required_extra: [possibility]
    template: T21_Idea.md
  question:
    path_globs:
      - 40_Knowledge/Questions/**/*.md
    statuses: [open, deciding, answered, deferred, closed]
    required_extra: [question_kind]
    optional_extra: [decision, decision_by, priority]
    conditional_requirements:
      - when: {question_kind: decision}
        require: [decision]
    template: T22_Question.md
  artifact:
    path_globs:
      - 20_Projects/*/Artifacts/**/*.md
      - 90_Archive/Projects/*/*/Artifacts/**/*.md
    statuses: [draft, review, final, deprecated]
    required_extra: [artifact_kind, projects]
    optional_extra: [artifact_uri, artifact_hash, artifact_repo, asset]
    field_constraints:
      projects: {min_items: 1, max_items: 1, must_resolve_to_parent_project_bundle: true}
      when_status_final_require_one_of: [artifact_uri, artifact_repo, asset]
      artifact_hash_must_bind_to: [artifact_uri, artifact_repo, asset]
    template: T23_Artifact.md
  area:
    path_globs:
      - 30_Areas/**/*.md
    statuses: [active, paused, retired]
    required_extra: [standard, review_cadence, next_review]
    template: T30_Area.md
  knowledge:
    path_globs:
      - 40_Knowledge/Notes/**/*.md
    statuses: [seed, developing, evergreen, deprecated]
    required_extra: [claim, confidence]
    optional_extra: [last_reviewed]
    template: T40_Knowledge.md
  source:
    path_globs:
      - 40_Knowledge/Sources/**/*.md
    statuses: [queued, reading, processed, archived]
    required_extra: [source_kind]
    optional_extra: [source_url, authors, published_date, citation_key, asset, asset_hash, extractor, extractor_version, page_locator_scheme, derived_from]
    field_constraints:
      when_status_processed_or_archived_require_one_of: [source_url, asset, derived_from, citation_key]
    template: T41_Source.md
  person:
    path_globs:
      - 40_Knowledge/People/**/*.md
    statuses: [active, inactive]
    required_extra: []
    optional_extra: [organization]
    default_ai_policy: deny
    template: T42_Person.md
  moc:
    path_globs:
      - 50_Maps/**/*.md
      - 20_Projects/*/Working/*MOC.md
      - 90_Archive/Projects/*/*/Working/*MOC.md
    statuses: [active, retired]
    required_extra: [scope]
    template: T50_MOC.md
  meeting:
    path_globs:
      - 60_Meetings/**/*.md
    statuses: [scheduled, held, cancelled]
    required_extra: [meeting_at, attendees]
    default_ai_policy: deny
    template: T60_Meeting.md
  home:
    exact_paths: [Home.md, Mobile.md]
    statuses: [active]
    required_extra: [purpose, audience]
    optional_extra: [cssclasses]
  system:
    path_globs:
      - 99_System/**/*.md
    exclude_globs:
      - 99_System/Templates/**/*.md
    statuses: [active, deprecated]
    required_extra: [purpose]

relation_registry:
  canonical_predicates:
    supports:
      allowed_subject_types: [source, knowledge]
      allowed_object_types: [knowledge]
    contradicts:
      allowed_subject_types: [source, knowledge]
      allowed_object_types: [knowledge]
    explains:
      allowed_subject_types: [knowledge]
      allowed_object_types: [knowledge, question]
    applies_to:
      allowed_subject_types: [knowledge]
      allowed_object_types: [project, idea]
    derived_from:
      allowed_subject_types: [idea, question, knowledge, project, artifact, source]
      allowed_object_types: [capture, daily, weekly, monthly, source, idea, meeting]
    implements:
      allowed_subject_types: [project]
      allowed_object_types: [idea]
    raises:
      allowed_subject_types: [idea, knowledge, project]
      allowed_object_types: [question]
  inverse_aliases:
    supported_by: invert_to_supports
    raised_by: invert_to_raises
  unknown_predicate_policy: propose_related_or_reject
  context_predicates:
    projects: {allowed_object_types: [project]}
    areas: {allowed_object_types: [area]}
    topics: {allowed_object_types: [moc]}
    sources: {allowed_object_types: [source]}
    people: {allowed_object_types: [person]}
    related: {allowed_object_types: [any_note]}
  edge_kinds:
    semantic: canonical_predicates
    context: context_predicates
    wikilink: notes_jsonl_only
  inverse_materialization: false
  proposal_provenance: ai_proposed
  canonical_projection_provenance: canonical_property
  canonical_source_locator: frontmatter_predicate_index
  canonical_object_locator: wikilink_fragment_or_null
  proposal_confidence_is_not_canonical: true
  receipt_provenance_is_local_audit_overlay: true

templates:
  directory: 99_System/Templates
  required:
    - T00_Capture.md
    - T01_AI_Proposal.md
    - T10_Daily.md
    - T11_Weekly.md
    - T12_Monthly.md
    - T20_Project.md
    - T21_Idea.md
    - T22_Question.md
    - T23_Artifact.md
    - T24_Project_Note.md
    - T30_Area.md
    - T40_Knowledge.md
    - T41_Source.md
    - T42_Person.md
    - T50_MOC.md
    - T60_Meeting.md

bases:
  directory: 99_System/Bases
  required:
    - Inbox.base
    - Projects.base
    - Decisions.base
    - Knowledge.base
    - Sources.base
    - Review.base
    - Journal.base
    - Compass.base
  views:
    Journal.base:
      Today Focus:
        filters: {type: daily, period_start: today}
        sort: [file_name_desc]
        limit: 1
        columns: [file.link, today_focus]
      Open Reviews:
        filters:
          type_in: [weekly, monthly]
          status: open
        sort: [period_start_desc, file_name_asc]
        limit: 2
        columns: [file.link, type, period_end]
      Due Areas:
        filters:
          type: area
          status_in: [active, paused]
          next_review_on_or_before_today: true
        sort: [next_review_asc, file_name_asc]
        limit: 3
        columns: [file.link, next_review, review_cadence]
    Compass.base:
      Signals:
        filters:
          or:
            - and:
                - type_in: [knowledge, source]
                - contradicts_nonempty: true
            - and:
                - type: knowledge
                - confidence_in: [low, unknown]
            - and:
                - type: idea
                - status_in: [seed, incubating, testing]
                - projects_empty: true
                - related_empty: true
                - raises_empty: true
        sort: [file_mtime_desc, file_name_asc]
        limit: 6
        columns: [file.link, type, status, confidence, contradicts, projects, related]
      Tensions:
        filters:
          or:
            - and:
                - type: knowledge
                - contradicts_nonempty: true
            - and:
                - type: source
                - contradicts_nonempty: true
        sort: [file_mtime_desc, file_name_asc]
        limit: 10
        columns: [file.link, type, confidence, contradicts]
      Research Gaps:
        filters:
          and:
            - type: question
            - status_in: [open, deciding]
            - question_kind_in: [research, problem]
            - projects_empty: true
        sort: [decision_by_asc_nulls_last, priority_high_to_low, file_mtime_desc, file_name_asc]
        limit: 10
        columns: [file.link, question_kind, projects, priority, decision_by]
      Unconnected Ideas:
        filters:
          and:
            - type: idea
            - status_in: [seed, incubating, testing]
            - projects_empty: true
            - related_empty: true
            - raises_empty: true
        sort: [file_mtime_desc, file_name_asc]
        limit: 10
        columns: [file.link, status, possibility, projects, related, raises]
      Low Confidence:
        filters:
          and:
            - type: knowledge
            - confidence_in: [low, unknown]
        sort: [file_mtime_desc, file_name_asc]
        limit: 10
        columns: [file.link, confidence, supports, contradicts, applies_to]
      Project Bridges:
        filters:
          and:
            - type: project
            - status_in: [active, blocked]
            - implements_nonempty: true
        sort: [focus_rank_asc, priority_high_to_low, target_date_asc_nulls_last, file_name_asc]
        limit: 10
        columns: [file.link, status, next_action, implements, target_date]
    Projects.base:
      Now:
        filters:
          type: project
          status_in: [active, blocked]
        sort: [focus_rank_asc, priority_high_to_low, target_date_asc_nulls_last, file_name_asc]
        limit: 3
        columns: [file.link, status, next_action, focus_rank, priority, target_date]
      Mobile:
        filters:
          type: project
          status_in: [active, blocked]
        sort: [focus_rank_asc, priority_high_to_low, target_date_asc_nulls_last, file_name_asc]
        limit: 3
        columns: [file.link, next_action, status]
      Active:
        filters:
          type: project
          status_in: [active, blocked]
        sort: [focus_rank_asc, priority_high_to_low, target_date_asc_nulls_last, file_name_asc]
        limit: 100
        columns: [file.link, status, next_action, target_date]
      Blocked:
        filters: {type: project, status: blocked}
        sort: [focus_rank_asc, priority_high_to_low, file_name_asc]
        limit: 5
        columns: [file.link, next_action, target_date]
    Decisions.base:
      Open:
        filters:
          type: question
          status_in: [open, deciding]
          question_kind: decision
        sort: [decision_by_asc_nulls_last, priority_high_to_low, file_name_asc]
        limit: 5
        columns: [file.link, decision, decision_by, projects, priority]
      Research Questions:
        filters:
          type: question
          status_in: [open, deciding]
          question_kind_in: [research, problem]
        sort: [decision_by_asc_nulls_last, priority_high_to_low, file_mtime_desc, file_name_asc]
        limit: 3
        columns: [file.link, question_kind, projects]
    Knowledge.base:
      Ideas:
        filters:
          type: idea
          status_in: [seed, incubating, testing]
        sort: [file_mtime_desc, file_name_asc]
        limit: 10
        columns: [file.link, status, possibility, projects, file.mtime]
      Radar:
        filters:
          type_in: [knowledge, idea]
        sort: [file_mtime_desc, file_name_asc]
        limit: 6
        columns: [file.link, type, status, confidence, file.mtime]
      Active Maps:
        filters: {type: moc, status: active}
        sort: [file_mtime_desc, file_name_asc]
        limit: 3
        columns: [file.link, scope, file.mtime]
    Inbox.base:
      Unprocessed:
        filters: {type: capture, status: unprocessed}
        sort: [created_asc, file_name_asc]
        limit: 10
        columns: [file.link, created, capture_kind, triage_hint, needs_desktop_review]
      Mobile Review:
        filters: {type: capture, status: unprocessed, needs_desktop_review: true}
        sort: [created_asc, file_name_asc]
        limit: 5
        columns: [file.link, capture_label, triage_hint]
    Sources.base:
      Reading queue:
        filters:
          type: source
          status_in: [queued, reading]
        sort: [published_date_desc_nulls_last, file_name_asc]
        limit: 10
        columns: [file.link, status, source_kind, authors, published_date]
      Processed:
        filters: {type: source, status: processed}
        sort: [file_mtime_desc, file_name_asc]
        limit: 20
        columns: [file.link, source_kind, published_date, source_url]
    Review.base:
      PendingOrConflict:
        filters: {type: proposal, status_in: [pending, conflict]}
        sort: [created_asc, file_name_asc]
        limit: 10
        columns: [file.link, status, proposal_id, created]
      Mobile Results:
        filters: {type: proposal, status_in: [pending, conflict]}
        sort: [created_desc, file_name_asc]
        limit: 5
        columns: [file.link, status, created]
  generated_against_installed_obsidian_version: true
  cli_query_smoke_required: true

dashboards:
  home:
    path: Home.md
    type: home
    audience: desktop
    layout: twelve_column_five_row
    cssclass: knowledgeos-home
    toolbar_policy: compact_navigation_only
    capture_contract:
      visible_on_home: false
      actions: [CAPTURE_THOUGHT, NEW_IDEA, NEW_PROJECT, NEW_QUESTION, NEW_KNOWLEDGE]
      hotkeys: [option_command_c, option_command_j, option_command_p, option_command_q, option_command_k]
      authority: quickadd_profile_and_blueprint_choice_registry
    sections:
      - name: tasks
        task_query: Home.md#tasks[1]
        layout_span: 12
        priority: P0
      - name: inbox
        source: Inbox.base
        view: Unprocessed
        limit: 10
        layout_span: 12
        priority: P0
      - name: ai_review
        views:
          - source: Review.base
            view: PendingOrConflict
            limit: 10
        layout_span: 12
        priority: P1
      - name: projects
        source: Projects.base
        view: Now
        limit: 3
        layout_span: 6
        status_in: [active, blocked]
        sort: [focus_rank_asc, priority_high_to_low, target_date_asc_nulls_last, file_name_asc]
      - name: decisions
        source: Decisions.base
        view: Open
        limit: 5
        layout_span: 6
        sort: [decision_by_asc_nulls_last, priority_high_to_low, file_name_asc]
      - name: review_pulse
        views:
          - source: Sources.base
            view: Reading queue
            limit: 10
          - source: Journal.base
            view: Open Reviews
            limit: 2
        layout_span: 6
        priority: P1
      - name: compass
        views:
          - source: Compass.base
            view: Signals
            limit: 6
          - source: Compass.base
            view: Tensions
            limit: 10
        layout_span: 6
        priority: P1
  mobile:
    path: Mobile.md
    type: home
    audience: mobile
    layout: single_column
    community_plugin_required: false
    stale_snapshot_notice_required: true
    sections:
      - name: quick_capture
        actions: [ko_capture, ko_save_source, ko_defer_to_mac, ko_sync]
        link_scheme: shortcuts_percent_encoded
      - name: today
        action: obsidian_daily_canonical_vault_name
      - name: focus_projects_and_next_actions
        source: Projects.base
        view: Mobile
        limit: 3
        canonical_action_field: next_action
      - name: needs_desktop_review
        source: Inbox.base
        view: Mobile Review
        limit: 5
      - name: ai_results
        source: Review.base
        view: Mobile Results
        limit: 5
      - name: bookmarks
        fallback: plain_wikilinks
        moc_fallback: obsidian_search_exact_vault_query_path_50_maps

