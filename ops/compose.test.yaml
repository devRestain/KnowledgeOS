name: knowledgeos-readiness
services:
  dev:
    image: sha256:e13a0e3a27ce50fbc622a80b5d69ee9e6ff9f1ab244d1c29aef6765260b8ab8b
    pull_policy: never
    user: "${KNOWLEDGEOS_UID:?Set KNOWLEDGEOS_UID through Make}:${KNOWLEDGEOS_GID:?Set KNOWLEDGEOS_GID through Make}"
    working_dir: /workspace/control/ops
    read_only: true
    network_mode: none
    environment:
      HOME: /tmp
      PYTHONPATH: /workspace/control/ops/src
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /tmp/uv
      KNOWLEDGEOS_TEST_HERMETIC: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      RUFF_CACHE_DIR: /tmp/ruff-cache
    volumes:
      - type: bind
        source: ${KNOWLEDGEOS_CONTROL_SOURCE:?Set KNOWLEDGEOS_CONTROL_SOURCE through Make}
        target: /workspace/control
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KNOWLEDGEOS_CORE_SOURCE:?Set KNOWLEDGEOS_CORE_SOURCE through Make}
        target: /workspace/Core
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: knowledgeos-vault-mask
        target: /workspace/KnowledgeHub
        read_only: true
      - type: volume
        source: knowledgeos-runtime-mask
        target: /workspace/control/runtime
        read_only: true
      - type: volume
        source: knowledgeos-runtime-mask
        target: /workspace/runtime
        read_only: true
      - type: volume
        source: knowledgeos-state-mask
        target: /workspace/state
        read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    labels:
      org.knowledgeos.owner: knowledgeos
      org.knowledgeos.purpose: disposable-core-readiness

volumes:
  knowledgeos-state-mask:
    driver: local
    driver_opts: &mask-options
      type: tmpfs
      device: tmpfs
      o: "uid=${KNOWLEDGEOS_UID:?Set KNOWLEDGEOS_UID through Make},gid=${KNOWLEDGEOS_GID:?Set KNOWLEDGEOS_GID through Make},mode=0700"
  knowledgeos-runtime-mask:
    driver: local
    driver_opts: *mask-options
  knowledgeos-vault-mask:
    driver: local
    driver_opts: *mask-options
