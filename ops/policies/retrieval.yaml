schema_version: 1
contract_id: knowledgeos-blueprint-v3
capability_profile: portable_core
artifact_kind: retrieval_policy
authoritative_inputs:
- path: blueprint/blueprint.yaml
  selectors:
  - /retrieval
  sha256: fe38aeb5336d7203acef735c11438f001fd6deffc7a1311199f7cf16ff1aa40d
retrieval:
  phases:
  - native_exact_and_links
  - lexical_fts
  - bounded_typed_graph_expansion
  graph_expansion:
    default_hops: 1
    maximum_hops: 1
    per_hop_node_cap: 20
    total_edge_cap: 60
    total_candidate_cap: 50
    one_hop_allowlist:
      predicates:
      - supports
      - contradicts
      - explains
      - applies_to
      - derived_from
      - implements
      - raises
      - projects
      - areas
      - topics
      - sources
      - people
      - related
      directions:
      - outgoing
      - incoming
    unknown_sequence_policy: reject
  corpus:
    default_include_types:
    - knowledge
    - source
    - project
    - project_note
    - artifact
    - idea
    - question
    journal_requires_explicit_scope: true
    exclude_paths:
    - .obsidian-*/**
    - 99_System/**
    - 01_AI_Review/Rejected/**
    - 01_AI_Review/Expired/**
    review_corpus_separate:
    - 01_AI_Review/Pending/**
    - 01_AI_Review/Conflict/**
  policy_gate_points:
  - before_candidate_selection
  - during_link_expansion
  - immediately_before_context_return
  filter_before_context:
  - scope
  - path
  - type
  - sensitivity
  - ai_policy
  frozen_candidate_fields:
  - query_sha256
  - policy_decision_sha256
  - index_generation_id
  - note_id
  - path
  - content_hash
  - chunk_id
  - chunk_hash
  - chunk_locator
  - retrieval_reason
  - lexical_score_and_rank
  - graph_path
  - parser_and_chunker_version
  - indexer_version
  - retrieval_config_sha256
  staleness:
    default: refresh_changed_documents
    running_query_pins_generation: false
  answer_requires:
  - note_id
  - path
  - locator
  - evidence_hash
  - uncertainty
