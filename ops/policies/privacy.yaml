schema_version: 1
contract_id: knowledgeos-blueprint-v3
capability_profile: portable_core
artifact_kind: privacy_policy
authoritative_inputs:
- path: blueprint/blueprint.yaml
  selectors:
  - /privacy
  sha256: 88e014582b7e18803ee6474e522f47aea46928c147647c71d8d5105af31e8c94
privacy:
  sensitivity_values:
  - public
  - personal
  - confidential
  ai_policy_values:
  - remote_ok
  - ask
  - local_only
  - deny
  defaults:
    general:
      sensitivity: personal
      ai_policy: ask
    person:
      sensitivity: personal
      ai_policy: deny
    meeting:
      sensitivity: personal
      ai_policy: deny
  forbidden_combinations:
  - sensitivity: confidential
    ai_policy: remote_ok
  multi_source_rule: every_source_must_pass_and_output_inherits_strictest
  configured_mcp_ask_policy: allow_with_owner_binding
  local_only_requires: trusted_local_execution_binding
  denied_and_confidential_excluded: true
