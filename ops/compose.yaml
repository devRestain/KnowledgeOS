services:
  dev:
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        KNOWLEDGEOS_UID: ${KNOWLEDGEOS_UID:-1000}
        KNOWLEDGEOS_GID: ${KNOWLEDGEOS_GID:-1000}
        UV_VERSION: ${KNOWLEDGEOS_UV_VERSION:-0.8.14}
    user: "${KNOWLEDGEOS_UID:-1000}:${KNOWLEDGEOS_GID:-1000}"
    working_dir: /workspace/control/ops
    environment:
      HOME: /home/vaultops
      PYTHONPATH: /workspace/control/ops/src
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /home/vaultops/.cache/uv
    volumes:
      - ..:/workspace/control
      - ../vault:/workspace/vault
      - ../runtime:/workspace/runtime
      - knowledgeos-uv-cache:/home/vaultops/.cache/uv
    network_mode: none

volumes:
  knowledgeos-uv-cache:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=${KNOWLEDGEOS_UID:-1000},gid=${KNOWLEDGEOS_GID:-1000},mode=0700"
