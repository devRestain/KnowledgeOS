services:
  dev:
    build:
      context: ..
      dockerfile: ops/Dockerfile
      args:
        KNOWLEDGEOS_UID: ${KNOWLEDGEOS_UID:?Set KNOWLEDGEOS_UID to the host numeric UID, or use make}
        KNOWLEDGEOS_GID: ${KNOWLEDGEOS_GID:?Set KNOWLEDGEOS_GID to the host numeric GID, or use make}
        UV_VERSION: ${KNOWLEDGEOS_UV_VERSION:-0.8.14}
    user: "${KNOWLEDGEOS_UID:?Set KNOWLEDGEOS_UID to the host numeric UID, or use make}:${KNOWLEDGEOS_GID:?Set KNOWLEDGEOS_GID to the host numeric GID, or use make}"
    working_dir: /workspace/control/ops
    environment:
      HOME: /home/vaultops
      PYTHONPATH: /workspace/control/ops/src
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /home/vaultops/.cache/uv
      KNOWLEDGEOS_SCHEDULED_ATTEMPT_ID: ${KNOWLEDGEOS_SCHEDULED_ATTEMPT_ID:-}
    volumes:
      - type: bind
        source: ${KNOWLEDGEOS_CORE_SOURCE:?Set KNOWLEDGEOS_CORE_SOURCE through Make}
        target: /workspace/Core
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KNOWLEDGEOS_CONTROL_SOURCE:?Set KNOWLEDGEOS_CONTROL_SOURCE through Make}
        target: /workspace/control
        bind:
          create_host_path: false
      - type: bind
        source: ${KNOWLEDGEOS_VAULT_SOURCE:?Set KNOWLEDGEOS_VAULT_SOURCE through Make}
        target: /workspace/KnowledgeHub
        bind:
          create_host_path: false
      - type: bind
        source: ${KNOWLEDGEOS_RUNTIME_SOURCE:?Set KNOWLEDGEOS_RUNTIME_SOURCE through Make}
        target: /workspace/runtime
        bind:
          create_host_path: false
      - type: bind
        source: ${KNOWLEDGEOS_STATE_SOURCE:?Set KNOWLEDGEOS_STATE_SOURCE through Make}
        target: /workspace/state
        bind:
          create_host_path: false
      - knowledgeos-uv-cache:/home/vaultops/.cache/uv
    network_mode: none

volumes:
  knowledgeos-uv-cache:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=${KNOWLEDGEOS_UID:?Set KNOWLEDGEOS_UID to the host numeric UID, or use make},gid=${KNOWLEDGEOS_GID:?Set KNOWLEDGEOS_GID to the host numeric GID, or use make},mode=0700"
