schema_version: 1
contract_id: knowledgeos-background-v1
capability: C24
authoritative_inputs:
- path: blueprint/blueprint.yaml
  selectors:
  - /automation_lanes
  - /bridge/detection
  - /commands
  sha256: 4886d9772f7a09975535647e63e7e0f1694c114a5077d9a1ec000d3e6e086a1d
activation:
  enabled_by_default: false
  launchd_active: false
  installation: deferred_to_E03
  explicit_authorization_required: true
worker:
  command:
  - vaultctl
  - ai
  - worker
  - --once
  declared_command: true
  request_namespace: .vault-bridge/requests/YYYY/MM/JOB_ID.json
  detection_baseline: manual_sync_then_vaultctl_bridge_ingest
  scheduled_reconcile_scans_local_committed_head: true
  performs_git_network_io: false
  runtime_write_scope:
  - awaiting_remote_authorization
  - queue
  - review
  - runs
  - receipts
  provider_called: false
  vault_mutated: false
  git_network_called: false
  recovery_action: reconcile_local_transaction_journals_without_apply
logging:
  format: bounded_jsonl_summary
  stdout_path: runtime/logs/worker.stdout.log
  stderr_path: runtime/logs/worker.stderr.log
  max_age_seconds: 3600
  max_bytes: 16384
  retain_bytes: 8192
  legacy_format_action: discard_on_first_bounded_wake
launchd:
  label: com.knowledgeos.vaultops
  run_at_load: false
  start_interval_seconds: 300
  throttle_interval_seconds: 60
  rollback: bootout_the_exact_label_and_remove_the_installed_plist
