# Source-side integration contract. This is not a Hermes-native job record.
# Materialize and validate an inactive job only after a pinned Hermes build exists.
schema_version: 1
contract_id: knowledgeos-scheduled-worker-v1
activation:
  enabled: false
  status: unadmitted
  profile: unselected
  supervisor: unselected
  materialization: source_review_then_digest_verified_copy
  symlink_allowed: false
trigger:
  owner: hermes_cron
  interval_seconds: 300
  maximum_catch_up_runs: 1
  delivery: local
  agent: none
  no_agent: true
  agent_reasoning: false
  prompt: null
  attached_skills: []
  schedule_management_tools: false
execution:
  owner: knowledgeos_worker_once
  launcher: scripts/knowledgeos_scheduled_worker.py
  container_service: dev
  command:
    - vaultctl
    - ai
    - worker
    - --once
    - --scheduled-report
  arguments_from_job: false
  model: null
  provider: false
  git_network: false
  canonical_apply: false
  detached_service: false
limits:
  request_count: 100
  deadline_seconds: 240
  cancellation_grace_seconds: 10
  concurrent_workers: 1
  lock_wait_seconds: 0
  stale_attempt_action: reconcile_before_ingest
  stdout_bytes: 8192
  stderr_bytes: 8192
state:
  source_config_schema: 2
  canonical_selector: KNOWLEDGEOS_STATE_ROOT
  legacy_selector: KNOWLEDGEOS_RUNTIME_ROOT
  live_compatibility_binding: Runtime/KnowledgeOS-runtime
  proposed_transfer_target: States/KnowledgeOS
  transfer_performed: false
  hermes_state_access: false
  execution_lock: worker/worker.lock
  attempt_marker: worker/attempt.json
  lock_acquisition: non_blocking
retention:
  knowledgeos_log_max_age_seconds: 3600
  knowledgeos_log_max_bytes: 16384
  knowledgeos_log_retained_bytes: 8192
  hermes_history_max_records: 100
  hermes_history_max_age_seconds: 2592000
  hermes_history_enforcement: verify_on_pinned_build_before_enable
