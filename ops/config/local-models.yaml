      model_digest: 64b933495768fbd3b87c20583d379728a07471e0c66733a9df87cd1901b3c44b
      enabled: true
      options:
        dimension: 4096
        truncate: false
        query_prefix: 'Instruct: Given a KnowledgeOS search query, retrieve note passages that answer or directly support
          the query

          Query: {query}'
        document_prefix: 'title: {title} | text: {text}'
    embedding_fallback:
      task: embedding
